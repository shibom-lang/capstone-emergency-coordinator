<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Response Coordinator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at top right, rgba(59, 130, 246, 0.15), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(168, 85, 247, 0.15), transparent 40%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid var(--glass-border);
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            background: linear-gradient(to right, #60a5fa, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 8px 0 0 0;
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .chat-box {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 16px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            align-self: flex-end;
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-message {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-bottom-left-radius: 4px;
        }

        /* Basic Markdown Styling inside bot messages */
        .bot-message h3 { margin-top: 0; }
        .bot-message table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .bot-message th, .bot-message td { border: 1px solid var(--glass-border); padding: 8px; text-align: left; }
        .bot-message th { background: rgba(255, 255, 255, 0.1); }

        .input-area {
            padding: 24px;
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            padding: 0 24px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(to right, #3b82f6, #6366f1);
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        .loading {
            align-self: flex-start;
            padding: 16px;
            color: var(--text-muted);
            font-style: italic;
            display: none;
        }
    </style>
    <!-- Include marked.js to render Markdown returned by the AI -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="chat-container">
        <div class="header">
            <h1>Emergency Coordinator</h1>
            <p>AI Concierge powered by MCP & Antigravity</p>
        </div>
        
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                Hello! I am the Emergency Response Coordinator. Do you need assistance finding shelter or food resources?
            </div>
            <div class="loading" id="loadingIndicator">Agent is reasoning and querying database...</div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="E.g., I need a shelter for my family..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const loadingIndicator = document.getElementById('loadingIndicator');

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Add user message
            addMessage(text, 'user-message');
            userInput.value = '';
            
            // Show loading
            loadingIndicator.style.display = 'block';
            chatBox.appendChild(loadingIndicator); // Move to bottom
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // Hide loading
                loadingIndicator.style.display = 'none';

                // Render markdown and add bot message
                addMessage(marked.parse(data.response), 'bot-message', true);
            } catch (error) {
                loadingIndicator.style.display = 'none';
                addMessage("Sorry, I encountered an error connecting to the server.", 'bot-message');
            }
        }

        function addMessage(content, className, isHTML = false) {
            const div = document.createElement('div');
            div.className = `message ${className}`;
            if (isHTML) {
                div.innerHTML = content;
            } else {
                div.textContent = content;
            }
            
            // Insert before loading indicator
            chatBox.insertBefore(div, loadingIndicator);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
